<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DataPrune Pricing</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 50px auto; padding: 20px; }
        .plan { border: 2px solid #00d4ff; padding: 20px; margin: 20px 0; border-radius: 8px; }
        .plan h2 { color: #00d4ff; }
        .price { font-size: 32px; font-weight: bold; }
        button { background: #00d4ff; color: black; padding: 15px 30px; border: none; cursor: pointer; font-size: 16px; }
    </style>
</head>
<body>
    <h1>DataPrune Pricing</h1>
    
    <div class="plan">
        <h2>Free</h2>
        <div class="price">£0</div>
        <p>100 requests/day</p>
        <button disabled>Current Plan</button>
    </div>
    
    <div class="plan">
        <h2>Starter</h2>
        <div class="price">£29/mo</div>
        <p>10,000 requests/day + SecureBridge</p>
        <button onclick="alert('Stripe checkout coming in v0.2.0')">Upgrade</button>
    </div>
    
    <div class="plan">
        <h2>Professional</h2>
        <div class="price">£99/mo</div>
        <p>100,000 requests/day + All features</p>
        <button onclick="alert('Stripe checkout coming in v0.2.0')">Upgrade</button>
    </div>
    
    <p><a href="/">← Back to home</a></p>
</body>
</html>
